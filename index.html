  var D = {"title": "Designing for Belonging", "subtitle": "German Jordanian University · MSc thesis by Nassar Telfah · confidential.", "info": ["Dear colleague,", "Thank you for taking part. This survey is part of a master's thesis at the German Jordanian University that is developing a design guideline to help architects design architecture faculty buildings in which students feel they belong. The guideline has ten categories and thirty-three design qualities. Your judgements tell us how important each one is, so that the guideline can give architects a clear order of priority.", "The survey uses the Analytic Hierarchy Process (AHP): you compare two items at a time, 32 comparisons in all. There are no right answers; we want your professional judgement.", "Your answers are confidential. Your name and position are seen only by the research team. In the thesis, experts are identified only by professional group and years of experience. If some of your comparisons contradict each other, the researcher may contact you to look at them again; this is a normal part of the method.", "Researcher: Nassar Telfah, MSc Sustainable Buildings, German Jordanian University. Supervisor: Dr. Emhaidy Gharaibeh. Co-supervisor: Dr. Omaimah Al Ali."], "how": ["Each screen compares two items, A and B. Tap the answer that says how they compare for students' sense of belonging. The next comparison then opens by itself. Use Back to change an answer.", "Part 1 compares the design qualities inside each category (23 comparisons). Part 2 compares the ten categories with each other (9 comparisons).", "When your answers already show how two items compare, the page completes that comparison for you, so the answers in each table always fit together. If an answer would need a difference larger than \"much more\", the page asks you to choose a softer answer.", "Keep \"much more\" for the biggest differences. If A is somewhat more important than B, and B somewhat more important than C, then A is clearly more important than C."], "consent": {"title": "Consent", "yes": "Yes, I agree to take part and for my anonymised judgements to be used in this research.", "no": "No, I do not want to take part."}, "name": "Your name", "position": "Your position (for example, Associate Professor at a university, or Architect at a firm)", "contact": "E-mail or phone for a follow-up (optional; used only if a comparison needs a second look)", "profile": [{"title": "Your main professional role", "choices": ["Practising architect", "Architecture academic", "University estates / facilities officer", "Other"]}, {"title": "Years of professional experience", "choices": ["5–9 years", "10–19 years", "20 years or more"]}, {"title": "Have you been involved in the design, briefing or management of university or school buildings?", "choices": ["Yes", "No"]}], "question": "For students' sense of belonging in their architecture faculty building, which matters more, and how much?", "choices": ["A >>> B (A is much more important)", "A >> B (A is clearly more important)", "A > B (A is somewhat more important)", "A = B (equally important)", "A < B (B is somewhat more important)", "A << B (B is clearly more important)", "A <<< B (B is much more important)"], "missing": "Optional: is any design quality missing that you consider essential for students' sense of belonging in an architecture faculty building?", "confirmation": "Thank you. Your answers have been saved.", "ri": {"3": 0.18, "4": 0.29, "10": 0.48}, "part2": [{"name": "Place identity", "desc": "Design that helps students recognise the building and identify with it: its character, how easy it is to read, and what it shows about architecture."}, {"name": "Place attachment", "desc": "Design that helps an emotional bond with the building to grow: places to stay, places that hold memories, rich surroundings and a feeling of being at home."}, {"name": "Social belonging", "desc": "Design that brings students together: meeting, gathering, working side by side and seeing each other."}, {"name": "Place dependence", "desc": "How well the building supports daily work: studio space, services and reliable facilities."}, {"name": "Safety and security", "desc": "Feeling safe and having privacy: visible routes, safety after dark and places to withdraw."}, {"name": "Physical and environmental quality", "desc": "Indoor conditions: temperature and air, daylight and lighting, and sound."}, {"name": "Cultural and historical continuity", "desc": "Continuity with local culture and heritage: local ways of building for the climate, local materials and history, and cultural and religious practice."}, {"name": "Inclusiveness and equity", "desc": "Fair use for everyone: access for all bodies, women and men served equally, and no need to pay to use the building."}, {"name": "Participation and ownership", "desc": "The part students play in shaping the building: displaying and personalising, changing their spaces, having a voice, and making and holding events they remember."}, {"name": "Environmental connection", "desc": "Connection with nature: views, usable green outdoor space and nature inside the building."}], "tables": [{"key": "C1", "label": "Part 1 · 1 of 10 · Place identity", "intro": "Design that helps students recognise the building and identify with it: its character, how easy it is to read, and what it shows about architecture.", "n": 3, "names": ["Architectural distinctiveness", "Legibility and landmarks", "Visible architectural identity"], "comps": [{"title": "A: Architectural distinctiveness   VS   B: Legibility and landmarks", "a": 0, "b": 1, "an": "Architectural distinctiveness", "ad": "A clear, recognisable character that sets the building apart from other buildings on campus.", "bn": "Legibility and landmarks", "bd": "A building that is easy to understand and find your way around, with an obvious entrance and landmarks inside."}, {"title": "A: Architectural distinctiveness   VS   B: Visible architectural identity", "a": 0, "b": 2, "an": "Architectural distinctiveness", "ad": "A clear, recognisable character that sets the building apart from other buildings on campus.", "bn": "Visible architectural identity", "bd": "A building that shows how it is made and teaches architecture through its visible structure and details."}, {"title": "A: Legibility and landmarks   VS   B: Visible architectural identity", "a": 1, "b": 2, "an": "Legibility and landmarks", "ad": "A building that is easy to understand and find your way around, with an obvious entrance and landmarks inside.", "bn": "Visible architectural identity", "bd": "A building that shows how it is made and teaches architecture through its visible structure and details."}]}, {"key": "C2", "label": "Part 1 · 2 of 10 · Place attachment", "intro": "Design that helps an emotional bond with the building to grow: places to stay, places that hold memories, rich surroundings and a feeling of being at home.", "n": 4, "names": ["Places to linger", "Special and memorable places", "Sensory and aesthetic richness", "Home-like places"], "comps": [{"title": "A: Places to linger   VS   B: Special and memorable places", "a": 0, "b": 1, "an": "Places to linger", "ad": "Comfortable places outside the classrooms where students choose to stay between and after classes.", "bn": "Special and memorable places", "bd": "At least one place with a strong character that students know, name and remember."}, {"title": "A: Places to linger   VS   B: Sensory and aesthetic richness", "a": 0, "b": 2, "an": "Places to linger", "ad": "Comfortable places outside the classrooms where students choose to stay between and after classes.", "bn": "Sensory and aesthetic richness", "bd": "Variety of light, height and material along the daily routes, so that the building is not monotonous."}, {"title": "A: Places to linger   VS   B: Home-like places", "a": 0, "b": 3, "an": "Places to linger", "ad": "Comfortable places outside the classrooms where students choose to stay between aces   VS   B: Studio community", "a": 0, "b": 2, "an": "Informal meeting spaces", "ad": "Entrances, corridors, junctions and courtyards designed so that people stop and meet.", "bn": "Studio community", "bd": "Shared studios and group tables where students work together, also outside class time."}, {"title": "A: Informal meeting spaces   VS   B: Visual connection between spaces", "a": 0, "b": 3, "an": "Informal meeting spaces", "ad": "Entrances, corridors, junctions and courtyards designed so that people stop and meet.", "bn": "Visual connection between spaces", "bd": "Glass, voids and galleries that let students see others at work in other spaces."}, {"title": "A: Collective gathering space   VS   B: Studio community", "a": 1, "b": 2, "an": "Collective gathering space", "ad": "A space that can hold the whole department for exhibitions, juries, lectures and events.", "bn": "Studio community", "bd": "Shared studios and group tables where students work together, also outside class time."}, {"title": "A: Collective gathering space   VS   B: Visual connection between spaces", "a": 1, "b": 3, "an": "Collective gathering space", "ad": "A space that can hold the whole department for exhibitions, juries, lectures and events.", "bn": "Visual connection between spaces", "bd": "Glass, voids and galleries that let students see others at work in other spaces."}, {"title": "A: Studio community   VS   B: Visual connection between spaces", "a": 2, "b": 3, "an": "Studio community", "ad": "Shared studios and group tables where students work together, also outside class time.", "bn": "Visual connection between spaces", "bd": "Glass, voids and galleries that let students see others at work in other spaces."}]}, {"key": "C4", "label": "Part 1 · 4 of 10 · Place dependence", "intro": "How well the building supports daily work: studio space, services and reliable facilities.", "n": 3, "names": ["Fit for studio work", "Access and nearby services", "Reliable, clean, maintained facilities"], "comps": [{"title": "A: Fit for studio work   VS   B: Access and nearby services", "a": 0, "b": 1, "an": "Fit for studio work", "ad": "Enough space and support for real studio work: desks, model storage, workshop and printing.", "bn": "Access and nearby services", "bd": "Opening hours that suit long working days, with food, water and printing in the building or close by."}, {"title": "A: Fit for studio work   VS   B: Reliable, clean, maintained facilities", "a": 0, "b": 2, "an": "Fit for studio work", "ad": "Enough space and support for real studio work: desks, model storage, workshop and printing.", "bn": "Reliable, clean, maintained facilities", "bd": "Toilets, power sockets and Wi-Fi that work, are clean and are repaired quickly."}, {"title": "A: Access and nearby services   VS   B: Reliable, clean, maintained facilities", "a": 1, "b": 2, "an": "Access and nearby services", "ad": "Opening hours that suit long working days, with food, water and printing in the building or close by.", "bn": "Reliable, clean, maintained facilities", "bd": "Toilets, power sockets and Wi-Fi that work, are clean and are repaired quickly."}]}, {"key": "C5", "label": "Part 1 · 5 of 10 · Safety and security", "intro": "Feeling safe and having privacy: visible routes, safety after dark and places to withdraw.", "n": 3, "names": ["Natural surveillance", "Safety after dark", "Privacy and refuge"], "comps": [{"title": "A: Natural surveillance   VS   B: Safety after dark", "a": 0, "b": 1, "an": "Natural surveillance", "ad": "Routes and entrances overlooked by occupied rooms and glazing, with no hidden corners.", "bn": "Safety after dark", "bd": "Routes, stairs and entrances used at night are lit, overlooked and short."}, {"title": "A: Natural surveillance   VS   B: Privacy and refuge", "a": 0, "b": 2, "an": "Natural surveillance", "ad": "Routes and entrances overlooked by occupied rooms and glazing, with no hidden corners.", "bn": "Privacy and refuge", "bd": "Quiet corners and small rooms where a student can withdraw and not be on display."}, {"title": "A: Safety after dark   VS   B: Privacy and refuge", "a": 1, "b": 2, "an": "Safety after dark", "ad": "Routes, stairs and entrances used at night are lit, overlooked and short.", "bn": "Privacy and refuge", "bd": "Quiet corners and small rooms where a student can withdraw and not be on display."}]}, {"key": "C6", "label": "Part 1 · 6 of 10 · Physical and environmental quality", "intro": "Indoor conditions: temperature and air, daylight and lighting, and sound.", "n": 3, "names": ["Thermal comfort and air quality", "Daylight and lighting", "Acoustic comfort"], "comps": [{"title": "A: Thermal comfort and air quality   VS   B: Daylight and lighting", "a": 0, "b": 1, "an": "Thermal comfort and air quality", "ad": "A comfortable temperature across the year and fresh air in crowded studios.", "bn": "Daylight and lighting", "bd": "Enough daylight without glare, and good task lighting in the evening."}, {"title": "A: Thermal comfort and air quality   VS   B: Acoustic comfort", "a": 0, "b": 2, "an": "Thermal comfort and air quality", "ad": "A comfortable temperature across the year and fresh air in crowded studios.", "bn": "Acoustic comfort", "bd": "Quiet enough to concentrate, with noisy uses separated from the studios."}, {"title": "A: Daylight and lighting   VS   B: Acoustic comfort", "a": 1, "b": 2, "an": "Daylight and lighting", "ad": "Enough daylight without glare, and good task lighting in the evening.", "bn": "Acoustic comfort", "bd": "Quiet enough to concentrate, with noisy uses separated from the studios."}]}, {"key": "C7", "label": "Part 1 · 7 of 10 · Cultural and historical continuity", "intro": "Continuity with local culture and heritage: local ways of building for the climate, local materials and history, and cultural and religious practice.", "n": 3, "names": ["Climate-responsive local architecture", "Historic connection and local materials", "Cultural and religious practice"], "comps": [{"title": " l accessibility", "ad": "Every space that students use can be reached without steps, with lifts and accessible toilets.", "bn": "Economic accessibility", "bd": "Places to sit and work without buying anything, free drinking water, and affordable printing and food."}, {"title": "A: Gender-sensitive design   VS   B: Economic accessibility", "a": 1, "b": 2, "an": "Gender-sensitive design", "ad": "Facilities for women and men of equal quality and distance, and no space dominated by one group.", "bn": "Economic accessibility", "bd": "Places to sit and work without buying anything, free drinking water, and affordable printing and food."}]}, {"key": "C9", "label": "Part 1 · 9 of 10 · Participation and ownership", "intro": "The part students play in shaping the building: displaying and personalising, changing their spaces, having a voice, and making and holding events they remember.", "n": 4, "names": ["Personalisation and display", "Control and adaptability", "Involvement in decisions and care", "Memorable events and collective making"], "comps": [{"title": "A: Personalisation and display   VS   B: Control and adaptability", "a": 0, "b": 1, "an": "Personalisation and display", "ad": "Surfaces and rules that let students mark their spaces and display their work.", "bn": "Control and adaptability", "bd": "Movable furniture, and windows, blinds and lights that students can adjust, in spaces that can change."}, {"title": "A: Personalisation and display   VS   B: Involvement in decisions and care", "a": 0, "b": 2, "an": "Personalisation and display", "ad": "Surfaces and rules that let students mark their spaces and display their work.", "bn": "Involvement in decisions and care", "bd": "Students are consulted about the building and take part in caring for it."}, {"title": "A: Personalisation and display   VS   B: Memorable events and collective making", "a": 0, "b": 3, "an": "Personalisation and display", "ad": "Surfaces and rules that let students mark their spaces and display t   function rAbout() {
    var f = function (id, title, val) { return '<label class="f" for="' + id + '">' + esc(title) + '</label><input type="text" id="' + id + '" value="' + esc(val) + '" autocomplete="off"><p class="err" id="' + id + '_e" role="alert"></p>'; };
    app.innerHTML = banner() + '<h2>About you</h2>' + f('name', D.name, S.name) + f('position', D.position, S.position) +
      D.profile.map(function (q, k) {
        return '<fieldset><legend>' + esc(q.title) + '</legend>' + q.choices.map(function (o) {
          return '<label class="opt"><input type="radio" name="p' + k + '" value="' + esc(o) + '"' + (S['p' + k] === o ? ' checked' : '') + '> <span>' + esc(o) + '</span></label>';
        }).join('') + '<p class="err" id="p' + k + '_e" role="alert"></p></fieldset>';
      }).join('') + f('contact', D.contact, S.contact) +
      '<button class="main" id="next">Continue</button>' + backBtn();
    ['name', 'position', 'contact'].forEach(function (id) {
      document.getElementById(id).oninput = function (ev) { S[id] = ev.target.value; document.getElementById(id + '_e').textContent = ''; keep(); };
    });
    D.profile.forEach(function (q, k) {
      document.getElementsByName('p' + k).forEach(function (r) {
        r.onchange = function () { S['p' + k] = r.value; document.getElementById('p' + k + '_e').textContent = ''; keep(); };
      });
    });
    document.getElementById('next').onclick = function () {
      var bad = null;
      var need = function (id, ok, msg) { if (!ok) { document.getElementById(id + '_e').textContent = msg; bad = bad || id; } };
      need('name', S.name.trim(), 'Enter your name.');
      need('position', S.position.trim(), 'Enter your position.');
      D.profile.forEach(function (q, k) { need('p' + k, S['p' + k], 'Choose one answer.'); });
      if (bad) { document.getElementById(bad + '_e').scrollIntoView({ block: 'center' }); return; }
      go(S.i + 1);
    };
  }
  function rHow() {
    app.innerHTML = banner() + '<h2>How to answer</h2>' + D.how.map(function (p) { return '<p>' + esc(p) + '</p>'; }).join('') +
      '<button class="main" id="next">Start Part 1</button>' + backBtn();
    document.getElementById('next').onclick = function () { go(S.i + 1); };
  }
  function rPart2() {
    app.innerHTML = '<h2>Part 1 is finished</h2><p>Part 2 compares the ten categories with each other: ' + (AUTO ? 9 : 45) + ' comparisons. These are the ten categories.</p><ul class="cats">' +
      D.part2.map(function (c) { return '<li><b>' + esc(c.name) + '.</b> ' + esc(c.desc) + '</li>'; }).join('') + '</ul>' +
      '<button class="main" id="next">Start Part 2</button>' + backBtn();
    document.getElementById('next').onclick = function () { go(S.i + 1); };
  }
  function rCmp(st) {
    var T = D.tables[st.table], c = T.comps[st.comp], cur = S.answers[c.title], hidden = 0;
    app.innerHTML = top(T.label, T.intro) + '<p class="q">' + esc(D.question) + '</p>' + card('A', c.an, c.ad) + card('B', c.bn, c.bd) +
      '<div class="answers" role="group" aria-label="Your answer">' + D.choices.map(function (t, i) {
        if (overflow(T, c, i)) { hidden++; return ''; }
        var m = /^(.*?) \((.*)\)$/.exec(t), side = i < 3 ? 'sa' : (i === 3 ? 'se' : 'sb');
        return '<button class="ans ' + side + (cur === i ? ' on' : '') + '" data-i="' + i + '"><code>' + esc(m[1]) + '</code><span>' + esc(m[2]) + '</span></button>';
      }).join('') + '</div>' + (hidden ? '<p class="after">Only the answers that fit your earlier answers in this table are shown.</p>' : '') +
      '<p class="err" id="ov" role="alert"></p>' + backBtn();
    Array.prototype.forEach.call(app.querySelectorAll('.ans'), function (b) {
      b.onclick = function () {
        var i = +b.getAttribute('data-i');
        var o = overflow(T, c, i);
        if (o) {
          document.getElementById('ov').innerHTML = 'With this answer, <b>' + esc(T.names[o[0]]) + '</b> would have to be more than \u201cmuch more important\u201d than <b>' +
            esc(T.names[o[1]]) + '</b>, which this scale cannot show. Choose a softer answer here, or use Back to soften an earlier answer.';
          return;
        }
        S.answers[c.title] = i; delete S.kept[T.key]; derive(T);
        Array.prototype.forEach.call(app.querySelectorAll('.ans'), function (x) { x.classList.remove('on'); });
        b.classList.add('on');
        keep();
        var to = S.back !== null ? S.back : S.i + 1;
        S.back = null;
        setTimeout(function () { go(to); }, 140);
      };
    });
  }
  function rCheck(st) {
    var T = D.tables[st.table], r = cr(T), list = clash(T).filter(function (c) { return !isAuto(c); });
    if (!list.length) list = T.comps.filter(function (c) { return !isAuto(c); });
    app.innerHTML = top(T.label, '') + '<h2>These three answers do not fit together</h2>' +
      list.map(function (c, k) { return '<button class="pick" data-k="' + k + '">' + inWords(T, c) + '</button>'; }).join('') +
      '<p class="after">Tap one to change it, or keep your answers.</p><button class="quiet" id="ok">Keep my answers and continue</button>' +
      '<p class="after">Consistency ratio of this table: ' + r.cr.toFixed(2) + '. The target is 0.10 or less.</p>';
    Array.prototype.forEach.call(app.querySelectorAll('.pick'), function (b) {
      b.onclick = function () {
        var c = list[+b.getAttribute('data-k')], n = -1;
        flow.forEach(function (f, k) { if (f.t === 'cmp' && f.table === st.table && T.comps[f.comp].title === c.title) n = k; });
        S.back = S.i; S.i = n; keep(); draw();
      };
    });
    document.getElementById('ok').onclick = function () { S.kept[T.key] = true; go(S.i + 1); };
  }
  function rLast() {
    app.innerHTML = top('Last question', '') + '<label class="f" for="m">' + esc(D.missing) + '</label><textarea id="m">' + esc(S.missing) + '</textarea>' +
      '<button class="main" id="send">Send my answers</button><p class="err" id="e" role="alert"></p>' + backBtn();
    document.getElementById('m').oninput = function (ev) { S.missing = ev.target.value; keep(); };
    document.getElementById('send').onclick = function () { send(true, document.getElementById('e'), document.getElementById('send')); };
  }
  function payload(yes) {
    var p = { id: S.id, consent: yes ? D.consent.yes : D.consent.no };
    if (!yes) return p;
    p.name = S.name; p.position = S.position; p.role = S.p0; p.years = S.p1; p.involved = S.p2; p.contact = S.contact; p.missing = S.missing;
    p.answers = {}; p.crs = {};
    D.tables.forEach(function (T) {
      T.comps.forEach(function (c) { p.answers[c.title] = D.choices[S.answers[c.title]]; if (isAuto(c)) { p.auto = p.auto || []; p.auto.push(c.title); } });
      p.crs[T.key] = Math.round(cr(T).cr * 1000) / 1000;
    });
    return p;
  }
  function send(yes, errBox, btn) {
    var p = payload(yes);
    if (btn) { btn.disabled = true; btn.textContent = 'Sending...'; }
    var fail = function () {
      if (btn) { btn.disabled = false; btn.textContent = 'Send my answers'; }
      errBox.textContent = 'Your answers could not be sent. Check your connection and try again. They are still on this device.';
    };
    var ok = function (r) {
      if (!r || !r.ok) { fail(); return; }
      forget();
      app.innerHTML = banner() + '<h1>' + esc(yes ? D.confirmation : 'Thank you for your time.') + '</h1>';
      window.scrollTo(0, 0);
    };
    if (PREVIEW) { window.__lastPayload = p; setTimeout(function () { ok({ ok: true }); }, 200); return; }
    if (EXEC) {
      // no cookies are sent, so Google's multi-account problem cannot happen; text/plain avoids a CORS preflight
      fetch(EXEC, { method: 'POST', body: JSON.stringify(p), credentials: 'omit', redirect: 'follow',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' } })
        .then(function (r) { return r.json(); }).then(ok).catch(fail);
      return;
    }
    google.script.run.withSuccessHandler(ok).withFailureHandler(fail).saveResponse(p);
  }

  var saved = null;
  if (store) { try { saved = JSON.parse(store.getItem(KEY)); } catch (e) { saved = null; } }
  if (saved && saved.id && saved.i > 0) { S = saved; rWelcome(); } else { draw(); }
})();
</script>
</body>
</html>
